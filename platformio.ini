[env:esp32dev]
platform = espressif32@~5.0.0
board = esp32dev
framework = arduino
lib_deps = 
	SD
	tinyu-zhao/TinyGPSPlus-ESP32@^0.0.2
	adafruit/Adafruit GFX Library@^1.12.0
	adafruit/Adafruit BusIO @ ^1.17.0
	olikraus/U8g2@^2.36.5
